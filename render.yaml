services:
  - type: web
    name: basketball-edge-v20-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-mobile.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FRONTEND_ORIGIN
        value: https://chat66189-wq.github.io
