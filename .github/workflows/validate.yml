name: Validate Basketball Edge v20 changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py sportapi_provider.py oddspapi_provider.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No inline script found in index.html")
          Path("/tmp/bea-v20-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bea-v20-inline.js
      - name: Validate bundled history snapshot
        run: python -m unittest discover -s tests -p "test_*.py" -v
